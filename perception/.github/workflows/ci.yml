name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install converter and geometry test dependencies
        run: python -m pip install numpy==2.5.4 pyarrow==26.0.0 pillow==13.0.0 pytest==9.2.0
      - name: Test
        run: python -m pytest --capture=sys -q
